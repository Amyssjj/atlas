# Fetches Wikipedia intros and Wikidata facts for events, people and rulers (tools/fact_fetch.py) and puts them on the `fact-check` branch.
# Run by hand (Actions → Facts → Run workflow); tools/fact_check.py compares them with the data.
name: Facts
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fact_fetch.py /tmp/out
      - name: Commit to fact-check
        run: |
          cd /tmp/out
          git init -q -b fact-check
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -q -m "Facts from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" fact-check
